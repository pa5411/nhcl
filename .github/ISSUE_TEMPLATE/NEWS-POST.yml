name: News Post
description: Use this form to create a news or event post on the library website.
body:
  - type: markdown
    attributes:
      value: Add a title for the post.
  - type: textarea
    id: post-details
    attributes:
      label: Post details
      description: Enter the details of the post
      placeholder: ex. We will be hosting our Christmas event on 28th November. 
    validations:
      required: true
  - type: dropdown
    id: categories
    attributes:
      label: Select one category for the news post.
      multiple: false
      options:
        - News
        - Event
    validations:
      required: true
  - type: dropdown
    id: tags
    attributes:
      label: Select any number of tags for the post.
      multiple: true
      options:
        - Christmas
        - Easter
        - Diwali
        - Health
        - Finance
        - Arts and Crafts
        - Writing
        - Business
        - Kids
        - Adults
    validations:
      required: true
  - type: upload
    id: screenshots
    attributes:
      label: Upload images or posters.
      description: Only JPEG and PNG are supported.
    validations:
      required: false
